name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag=$(gh release list --limit 100 --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '[.[].tagName | select(test("^build-[0-9]+$"))
              | sub("^build-"; "") | tonumber | select(. < (env.GITHUB_RUN_NUMBER | tonumber))]
              | max | if . == null then "" else "build-\(.)" end')
          python3 ci/release_notes.py "$previous_tag" "$RUNNER_TEMP/release-notes.md"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unpack the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SHOAL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SHOAL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and run unit tests
        env:
          SHOAL_KEYSTORE_PASSWORD: ${{ secrets.SHOAL_KEYSTORE_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SHOAL_KEY_ALIAS: ${{ secrets.SHOAL_KEY_ALIAS }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease testDebugUnitTest --stacktrace 2>&1 | tee build.log

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      - name: Save error log to ci-log branch
        if: failure() && hashFiles('build.log') != ''
        run: |
          grep -E "^e: |What went wrong|Could not (find|resolve|GET)|^> |error:" build.log | head -60 > errors.txt || true
          head -45 errors.txt | while IFS= read -r line; do echo "::error::$line"; done
          cp build.log ci-build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rqf --cached .
          git add -f ci-build.log errors.txt
          git commit -qm "Build log ${{ github.run_number }}"
          git push -f origin ci-log

      - name: Rename APK
        # Swordfish.apk is the same file, for copies of Shoal and this app from before the rename.
        run: |
          cp app/build/outputs/apk/release/app-release.apk Angelfish.apk
          cp Angelfish.apk Swordfish.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Angelfish
          path: Angelfish.apk

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Angelfish build ${{ github.run_number }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            Angelfish.apk
            Swordfish.apk
          make_latest: true

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: Angelfish

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build instrumented tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # UI tests first (the ones that need YouTube itself are skipped here), then the screenshot tour.
          script: |
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notAnnotation=io.github.shoalapps.swordfish.NetworkTest
            python3 ci/smoke.py Angelfish.apk

      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-report
          path: app/build/reports/androidTests/connected

      - name: Save screenshots to ci-shots branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r shots /tmp/out/ 2>/dev/null || mkdir -p /tmp/out/shots
          cd /tmp/out
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-shots
          git add -A
          if ! git commit -qm "Emulator run ${{ github.run_number }}"; then echo "No screenshots this run"; exit 0; fi
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-shots
